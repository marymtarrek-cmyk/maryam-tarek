<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
<body>
  <form align="center">
    <p>Let us know how we can improve freeCodeCamp</p>
    <label>Name:</label>
    <input type="text" name="Name" placeholder="Enter your name">
    <br>
    <br>
    <label>Email:</label>
    <input type="email" name="emal" placeholder="Enter your email">
    <br>
    <br>
    <label>Age:</label>
    <input type="number" name="age" placeholder="Age" min="1" max="100">
    <br>
    <br>
    <label>which option best describes your current role?</label>
    <select>
       <option>Student</option>
       <option>Graduate</option>
      
    </select>
    <br></br>
    <label>How likely is that you would recommend  <br> freeCodeCamp to a friend?</label>
    <br>
    <input type="radio" id="definitly" name="choice">
    <label  for="definitly">Definitly</label>
    <br>
    <input type="radio" id="maybe" name="choice">
    <label for="maybe">Maybe</label>
    <br>
    <input type="radio" id="not sure" name="choice">
    <label for="not sure">Not Sure</label>
    <br></br>
    <label>What do you like most in FCC?</label>
    <select>
        <option selected  disabled> select an option</option>
    </select>
    <br></br>
    <label>Things that should be improved in the future<br>(Check all that apply):</label>
    <br>
    <input type="checkbox" id="front" name="front">
    <label for="front">Front-end Projects</label>
    <br>
    <input type="checkbox" id="back" name="back">
    <label for="back">Back-end Projects</label>
    <br>
    <input type="checkbox" id="data" name="data">
    <label for="data">Data visualization</label>
    <br>
    
 

  </form>
</body>
</html>
